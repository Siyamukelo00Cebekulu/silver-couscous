name: CI

on:
  push:
  pull_request:

jobs:
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore GrandPrixTeamPrincipal.sln
      - run: dotnet build GrandPrixTeamPrincipal.sln --configuration Release --no-restore
      - run: dotnet test GrandPrixTeamPrincipal.sln --configuration Release --no-build
      - run: dotnet run --project tools/ContentValidator/ContentValidator.csproj --configuration Release -- content
